<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Help Panel</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <div class="panel">
      <div class="header">
        <strong>AI Helper</strong>
        <button id="closeBtn" aria-label="Close">x</button>
      </div>

      <div class="toolbar">
        <button id="toggleSettingsBtn" class="mini" title="Show or hide API settings" aria-label="Toggle settings">
          S
        </button>
        <button id="toggleCaptureBtn" class="mini" title="Show or hide screen inspector" aria-label="Toggle screen inspector">
          V
        </button>
        <button
          id="analyzeBtn"
          class="mini primary hidden"
          title="Analyze current screen once and guide you for this one screenshot."
          aria-label="Analyze current screenshot once"
        >
          N
        </button>
        <button
          id="toggleOnScreenBtn"
          class="mini hidden"
          title="Enable on-screen prompts (currently off)"
          aria-label="Toggle on-screen prompts"
        >
          O
        </button>
        <button
          id="startDiyBtn"
          class="mini hidden"
          title="Continuously take frequent screenshots and guide you step by step as the screen changes."
          aria-label="Start DIY mode"
        >
          D
        </button>
        <button id="stopDiyBtn" class="mini hidden" title="Stop DIY mode" aria-label="Stop DIY mode" disabled>d</button>
        <button
          id="startAutoBtn"
          class="mini hidden"
          title="Automatically execute safe browser steps in the built-in browser."
          aria-label="Start browser auto mode"
        >
          A
        </button>
        <button id="stopAutoToolbarBtn" class="mini hidden" title="Stop browser auto mode" aria-label="Stop browser auto mode" disabled>
          a
        </button>
      </div>

      <div class="panel-section update-panel">
        <div class="update-tools">
          <button id="checkUpdateBtn" class="secondary">Check Updates</button>
          <button id="installUpdateBtn" class="secondary" disabled>Install Update</button>
        </div>
        <div id="updateStatus" class="status">Updates: not checked.</div>
      </div>

      <div id="settingsPanel" class="panel-section hidden">
        <div class="settings">
          <label for="provider">Provider</label>
          <select id="provider">
            <option value="openai">OpenAI</option>
            <option value="gemini">Gemini</option>
            <option value="grok">Grok</option>
          </select>
          <label for="apiKey">API Key</label>
          <input id="apiKey" type="password" placeholder="Paste provider API key" />
          <label for="browserChannel">Browser</label>
          <select id="browserChannel">
            <option value="chrome">Chrome</option>
            <option value="msedge">Edge</option>
            <option value="brave">Brave</option>
            <option value="chromium">Chromium</option>
          </select>
          <label class="inline-toggle" for="browserUsePersistentProfile">
            <input id="browserUsePersistentProfile" type="checkbox" />
            Use an existing logged-in browser profile
          </label>
          <label for="browserProfileDirectory">Profile Folder</label>
          <input id="browserProfileDirectory" type="text" placeholder="Default or Profile 1" />
          <label for="browserUserDataDir">User Data Folder</label>
          <input id="browserUserDataDir" type="text" placeholder="%LOCALAPPDATA%\\Google\\Chrome\\User Data" />
          <label for="browserExecutablePath">Browser EXE Path</label>
          <input id="browserExecutablePath" type="text" placeholder="Optional custom chrome.exe path" />
          <div class="settings-note">
            If you use a logged-in profile, close Chrome windows for that same profile before starting automation.
          </div>
          <button id="saveKeyBtn" class="secondary">Save Settings</button>
        </div>
      </div>

      <div id="capturePanel" class="panel-section hidden">
        <div id="captureStatus" class="status">Screen vision ready.</div>
        <img id="preview" alt="Latest captured screen" />
        <button id="captureAgainBtn" class="secondary">Inspect Screen</button>
      </div>

      <div class="composer">
        <textarea id="question" placeholder="Tell the browser what to do..." rows="2"></textarea>
        <button id="sendBtn" class="send-btn" title="Run browser task">Run</button>
        <button id="stopAutoBtn" class="secondary" title="Stop browser automation" aria-label="Stop browser automation" disabled>
          Stop
        </button>
      </div>

      <div id="stepNav" class="step-nav hidden">
        <button id="prevStepBtn" class="secondary step-nav-btn" title="Previous on-screen step">&lt;</button>
        <div id="stepNavLabel" class="step-nav-label">Step 1 / 1</div>
        <button id="nextStepBtn" class="secondary step-nav-btn" title="Next on-screen step">&gt;</button>
      </div>

      <div id="response" class="response">Your AI response will appear here.</div>
    </div>
    <script src="./panel.js"></script>
  </body>
</html>
